name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: 5
            package: qtbase5-dev
            config: /usr/lib/x86_64-linux-gnu/cmake/Qt5
          - qt: 6
            package: qt6-base-dev
            config: /usr/lib/x86_64-linux-gnu/cmake/Qt6
    name: Qt ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.package }}
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DQT_DIR=${{ matrix.config }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
